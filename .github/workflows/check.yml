name: Check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.2
      # Full history is fetched above so the scan can see every local ref before dependencies are installed.
      - run: npm run scan:secrets
      # The runner's TEMP is an 8.3 short path; Vault refuses a data folder whose real path differs from the one it was given, so the tests use the long one.
      - run: |
          Add-Content -Path $env:GITHUB_ENV -Value "TEMP=$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_ENV -Value "TMP=$env:RUNNER_TEMP"
        shell: pwsh
      - run: npm ci
      - run: npm audit --audit-level=high
      # The packages build before the typecheck, because the service and the app read the built core and client.
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      # The app smoke drives the real window with Vault's own Electron on synthetic data, both scenarios. npm ci skips the Electron download, so it is fetched
      # here and checked against the hashes the locked electron package ships. Git Bash waits for electron.exe, which is a window program.
      - run: node node_modules/electron/install.js
      - run: node_modules/electron/dist/electron.exe packages/app/test/smoke.cjs
        shell: bash
        timeout-minutes: 20
      - run: node_modules/electron/dist/electron.exe packages/app/test/smoke.cjs
        shell: bash
        timeout-minutes: 10
        env:
          VAULT_SMOKE: join
      # The screens hold synthetic data only; on a failure they show where the app stopped.
      - name: Upload the smoke screens
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-screens
          path: build/screens
          if-no-files-found: ignore
      # Builds the installer and the console zip and writes SHA256SUMS.txt. It publishes nothing.
      - run: npm run dist
